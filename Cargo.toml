[package]
name = "kcc2d"
description = "A reusable 2D kinematic character controller for Bevy, built on avian2d."
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["2d"] }
avian2d = { version = "0.7", default-features = false, features = [
    "2d",
    "f32",
    "parry-f32",
] }
serde = { version = "1", features = ["derive"], optional = true }

[features]
# Enables the gizmo + on-screen readout debug plugin (`KccDebugPlugin`).
debug = ["bevy/bevy_ui", "bevy/default_font"]
# Derives `Serialize`/`Deserialize` on the controller's components.
#
# `ControllerState` is not only animation data: `coyote`, `jump_buffer`, `wall_lockout` and
# `prev_crouch` decide whether the next jump fires and whether a crouch press starts a slide.
# A rollback network has to carry them in its snapshots, or every correction quietly resets the
# character's buffered input and edge detection.
serde = ["dep:serde", "avian2d/serialize"]

[[example]]
name = "playground"
# The playground showcases the controller with the debug overlay enabled.
required-features = ["debug"]

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
